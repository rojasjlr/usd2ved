<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USD ↔ VED</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2150/2150150.png">

    <link rel="stylesheet" href="css/styles.css">

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('Service Worker registrado', reg))
            .catch(err => console.error('Error al registrar SW', err));
        });
      }
    </script>
</head>
<body>
    <div class="app">
        <h1>🇻🇪 USD ↔ VED</h1>
        
        <div class="cards">
            <div class="card" id="card-bcv">
                <div class="card-title">BCV USD</div>
                <div class="card-value" id="tasaBCV">---</div>
                <div class="card-date" id="fechaBCV"></div>
            </div>
            
            <div class="card" id="card-euro">
                <div class="card-title">EURO BCV</div>
                <div class="card-value" id="tasaEuro">---</div>
            </div>
            
            <div class="card" id="card-usdt">
                <div class="card-title">USDT</div>
                <div class="card-value" id="tasaUSDT">---</div>
            </div>
        </div>

        <div class="conversor">
            <!-- INPUTS DIRECTOS (AMBOS EDITABLES) -->
            <div class="inputs-conversor">
                <div class="input-group input-usd">
                    <label>USD (Dólares)</label>
                    <input type="text" id="inputUSD" placeholder="0,00" value="1,00">
                </div>

                <div class="input-group input-ves">
                    <label>VED (Bolívares)</label>
                    <input type="text" id="inputVES" placeholder="0,00" value="---">
                </div>
            </div>

            <div class="personalizada-group" id="personalizadaGroup" style="display: none;">
                <label>Ingresa tu tasa personalizada:</label>
                <input type="text" id="tasaPersonalizadaInput" placeholder="0,00" value="40,00">
            </div>

            <div class="tasa-selector">
                <p>Usar tasa:</p>
                <div class="opciones">
                    <label class="opcion">
                        <input type="radio" name="tasa" value="bcv" checked> BCV USD
                    </label>
                    <label class="opcion">
                        <input type="radio" name="tasa" value="euro"> Euro BCV
                    </label>
                    <label class="opcion">
                        <input type="radio" name="tasa" value="usdt"> USDT
                    </label>
                    <label class="opcion">
                        <input type="radio" name="tasa" value="personalizada"> Personalizada
                    </label>
                </div>
            </div>
        </div>

        <div class="footer">
            <p id="ultimaActualizacion">Cargando...</p>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
